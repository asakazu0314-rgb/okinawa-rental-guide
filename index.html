<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Okinawa Rental Guide (test)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>ようこそ沖縄へ！</h1>
    <p>This is a test page. If you can read this on your iPad, the preview works.</p>
    <p class="ja">テスト用のページです。iPadのSafariで読めたら、プレビューは成功です。</p>

    <p><a href="guide/index.html">Guest guide (EN)</a> / <a href="guide/index-ja.html">出発前ガイド（日本語）</a> / <a href="guide/insurance-ja.html">保険・NOC（日本語）</a> / <a href="guide/check.html">出発前の確認（理解しました）</a> / <a href="guide/review.html">確認モード（店長向け）</a></p>

    <section class="tool-check">
      <h2>iPad Tool Check</h2>
      <label for="sample">Type something / 何か入力してください</label>
      <input id="sample" type="text" placeholder="e.g. Hello Okinawa">
      <button id="show" type="button">Show / 表示する</button>
      <p id="result" aria-live="polite"></p>
    </section>
  </main>

  <script>
    document.getElementById('show').addEventListener('click', function () {
      var text = document.getElementById('sample').value.trim();
      document.getElementById('result').textContent = text
        ? 'You typed: ' + text
        : 'Please type something first. / まず何か入力してください。';
    });
  </script>
</body>
</html>
